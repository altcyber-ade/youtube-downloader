name: Build and release desktop apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to build and publish (for example v0.2.5)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt
          python -m pip install Pillow

      - name: Verify build-time dependencies
        run: |
          python -c "import yt_dlp, psutil; from importlib.metadata import version; import importlib.util; assert importlib.util.find_spec('yt_dlp_plugins.extractor.getpot_wpc'); print('yt-dlp', yt_dlp.version.__version__); print('WPC', version('yt-dlp-getpot-wpc')); print('psutil', psutil.__version__)"

      - name: Create Windows icon
        shell: pwsh
        run: |
          if (-not (Test-Path "assets/app-icon.png")) { throw "assets/app-icon.png is missing" }
          python -c "from PIL import Image; im=Image.open('assets/app-icon.png').convert('RGBA'); im.save('packaging/app-icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --paths . `
            --icon packaging/app-icon.ico `
            --runtime-hook packaging/macos_runtime_path.py `
            --collect-submodules yt_dlp_plugins `
            --collect-all yt_dlp_plugins.extractor.getpot_wpc `
            --copy-metadata yt-dlp-getpot-wpc `
            --name "YouTube-Downloader-Windows" `
            packaging/release_launcher.py

      - name: Smoke-test Windows executable
        shell: pwsh
        run: |
          & "dist/YouTube-Downloader-Windows.exe" --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/YouTube-Downloader-Windows.exe

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt

      - name: Verify build-time dependencies
        run: |
          python -c "import yt_dlp, psutil; from importlib.metadata import version; import importlib.util; assert importlib.util.find_spec('yt_dlp_plugins.extractor.getpot_wpc'); print('yt-dlp', yt_dlp.version.__version__); print('WPC', version('yt-dlp-getpot-wpc')); print('psutil', psutil.__version__)"

      - name: Create macOS icon
        run: |
          test -f assets/app-icon.png
          rm -rf packaging/app-icon.iconset
          mkdir -p packaging/app-icon.iconset
          sips -z 16 16     assets/app-icon.png --out packaging/app-icon.iconset/icon_16x16.png
          sips -z 32 32     assets/app-icon.png --out packaging/app-icon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/app-icon.png --out packaging/app-icon.iconset/icon_32x32.png
          sips -z 64 64     assets/app-icon.png --out packaging/app-icon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/app-icon.png --out packaging/app-icon.iconset/icon_128x128.png
          sips -z 256 256   assets/app-icon.png --out packaging/app-icon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/app-icon.png --out packaging/app-icon.iconset/icon_256x256.png
          sips -z 512 512   assets/app-icon.png --out packaging/app-icon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/app-icon.png --out packaging/app-icon.iconset/icon_512x512.png
          sips -z 1024 1024 assets/app-icon.png --out packaging/app-icon.iconset/icon_512x512@2x.png
          iconutil -c icns packaging/app-icon.iconset -o packaging/app-icon.icns

      - name: Build macOS app
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --paths . \
            --icon packaging/app-icon.icns \
            --runtime-hook packaging/macos_runtime_path.py \
            --collect-submodules yt_dlp_plugins \
            --collect-all yt_dlp_plugins.extractor.getpot_wpc \
            --copy-metadata yt-dlp-getpot-wpc \
            --name "YouTube Downloader" \
            packaging/release_launcher.py

      - name: Smoke-test macOS app
        run: |
          "dist/YouTube Downloader.app/Contents/MacOS/YouTube Downloader" --self-test

      - name: Package macOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/YouTube Downloader.app" \
            "dist/YouTube-Downloader-macOS.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/YouTube-Downloader-macOS.zip

  publish-release:
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              release/YouTube-Downloader-Windows.exe \
              release/YouTube-Downloader-macOS.zip \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              release/YouTube-Downloader-Windows.exe \
              release/YouTube-Downloader-macOS.zip \
              --generate-notes \
              --title "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY"
          fi
