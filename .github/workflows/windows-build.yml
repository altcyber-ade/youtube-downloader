name: Build and release Windows executable

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to build and publish (for example v0.1.0)"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt

      - name: Build executable
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name "yt-dlp-MP3-Downloader"
          yt_dlp_mp3_gui.py

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-MP3-Downloader-Windows
          path: dist/yt-dlp-MP3-Downloader.exe

      - name: Publish executable to GitHub Release
        if: startsWith(env.RELEASE_TAG, 'v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "dist\yt-dlp-MP3-Downloader.exe"
          if (gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" 2>$null) {
            gh release upload "$env:RELEASE_TAG" $asset --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create "$env:RELEASE_TAG" $asset --generate-notes --title "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY"
          }
